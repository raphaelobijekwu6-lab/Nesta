<script>try{var t=localStorage.getItem('nesta-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#F5EDE0;--card:#FCF8F0;--tx:#3E2814;--mu:#7A6450;--br:#DDD0B8;--pr:#5C3D1B;--pr2:#EDE4D3;--ac:#B3833B;--on:#FFFFFF;--hero:linear-gradient(135deg,#EDE4D3,#F8F2E8);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C1510;--card:#281D15;--tx:#F5EDE0;--mu:#BBA78C;--br:#4A3A2A;--pr:#D2A15F;--pr2:#33261B;--ac:#DDB56C;--on:#1C1510;--hero:linear-gradient(135deg,#2D2118,#3A2A1E)}}
:root[data-theme="dark"]{--bg:#1C1510;--card:#281D15;--tx:#F5EDE0;--mu:#BBA78C;--br:#4A3A2A;--pr:#D2A15F;--pr2:#33261B;--ac:#DDB56C;--on:#1C1510;--hero:linear-gradient(135deg,#2D2118,#3A2A1E)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
.w0{max-width:1000px;margin:0 auto;padding:0 16px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.brand{display:flex;align-items:center;gap:8px}.lg{height:42px;width:auto}.lgd{display:none}.wm{font:600 19px Georgia,'Times New Roman',serif;letter-spacing:.16em;color:var(--tx)}
header{flex-wrap:wrap;gap:8px}header .btn{padding:8px 12px;font-size:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lgl{display:none}:root:not([data-theme="light"]) .lgd{display:block}}
:root[data-theme="dark"] .lgl{display:none}:root[data-theme="dark"] .lgd{display:block}
button{font:inherit;cursor:pointer}
.btn{background:var(--pr);color:var(--on);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn.o{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}
.btn.w{width:100%;margin-top:8px}
.hero{padding:26px 18px 28px;border-radius:20px;background:var(--hero);border:1px solid var(--br);position:relative;overflow:hidden;margin-bottom:16px}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--ac),transparent)}
h1{font:700 clamp(26px,6vw,40px)/1.15 Georgia,serif;margin:0 0 8px;color:var(--tx)}
.sub{color:var(--mu);margin:0 0 16px}.tg{font:600 12px system-ui,sans-serif;letter-spacing:.22em;color:var(--ac);margin:0 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;background:var(--card);border:1px solid var(--br);border-radius:14px;padding:10px}
input,select,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid var(--br);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.bar select,.bar input{flex:1 1 130px;width:auto;margin:0}
.tabs{display:flex;gap:8px;margin:14px 0 0;overflow-x:auto;padding-bottom:4px}
.tab{background:var(--card);color:var(--tx);border:1px solid var(--br);border-radius:99px;padding:7px 14px;white-space:nowrap}
.tab.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
#map{display:none;height:340px;border-radius:14px;border:1px solid var(--br);margin-bottom:14px;z-index:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;padding-bottom:30px}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 2px 8px #3b241714}
.card.sp{border:2px solid var(--ac)}
.img{height:160px;position:relative;background:linear-gradient(135deg,#CDB791,#9A7440) center/cover;display:flex;align-items:center;justify-content:center}
.ph{font-size:48px;opacity:.7}
.tag{position:absolute;top:10px;left:10px;background:var(--ac);color:#222;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px}
.tag.r{left:auto;right:10px;background:#2f855a;color:#fff}
.tag.b{top:auto;bottom:10px}
.fv{position:absolute;bottom:8px;right:10px;background:var(--card);border-radius:99px;padding:3px 9px;font-size:17px;color:#c53030}
.cb{padding:12px}.pr{font:800 19px Georgia,serif;color:var(--pr)}.mu{color:var(--mu);font-size:14px}
.ov{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:9999}
.ov.s{display:flex}
.mo{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.mo h2{margin:0 0 6px;font-family:Georgia,serif}
.row{display:flex;gap:8px}.row>*{flex:1}
.note{background:var(--pr2);border-radius:10px;padding:10px;font-size:14px;margin:10px 0}
.pt{cursor:pointer}
.x{float:right;background:none;border:0;font-size:26px;color:var(--mu)}
.gal{display:flex;gap:8px;overflow-x:auto;margin:6px 0 10px}
.gal img,.gal video{height:200px;border-radius:12px;flex:none}
.ph2{height:140px;width:100%;display:flex;align-items:center;justify-content:center;font-size:56px;background:var(--pr2);border-radius:12px}
.ok{color:#2f855a}.er{color:#c53030;font-size:14px;min-height:18px;margin:6px 0 0}.c{text-align:center}
.ms{height:260px;overflow:auto;background:var(--bg);border-radius:10px;padding:8px;margin:8px 0}
.me,.th{margin:4px 0}.me{text-align:right}
.me span,.th span{display:inline-block;max-width:80%;padding:6px 10px;border-radius:12px;background:var(--card);text-align:left}
.me span{background:var(--pr);color:var(--on)}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:30px 10px}
footer{text-align:center;color:var(--mu);font-size:13px;padding:10px 0 30px}
.pin{font-size:30px;line-height:1;filter:drop-shadow(0 2px 2px #0006)}
#pmap{height:240px;border-radius:12px;border:1px solid var(--br);margin:8px 0}
.cact{display:flex;gap:8px;padding:0 12px 12px}.cact button{flex:1;padding:8px;font-size:14px}
.bdg{position:absolute;top:-7px;right:-7px;background:#c53030;color:#fff;border-radius:99px;font-size:11px;min-width:18px;padding:1px 5px;display:none;line-height:1.4;font-weight:700}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;max-width:520px;margin:0 auto;background:var(--pr);color:var(--on);padding:12px 14px;border-radius:12px;z-index:10000;box-shadow:0 6px 20px #0006;cursor:pointer;display:none}
.mo h3{margin:16px 0 6px;font-family:Georgia,serif}footer a{color:var(--pr);cursor:pointer;text-decoration:underline}
</style>
</head>

function list(){
  const c=$('city').value,t=$('type').value,mx=+$('max').value||1e15;
  let r=L.filter(l=>(mode=='all'||l.mode==mode)&&(!c||l.city==c)&&(!t||l.type==t)&&l.price<=mx&&(!vo||l.profiles?.verified)&&(!sv||FV.has(l.id)));
  r.forEach(l=>{l._d=near&&l.lat!=null?km(near,[l.lat,l.lng]):null});
  if(near)r.sort((a,b)=>(a._d??1e9)-(b._d??1e9));
  const sp=r.filter(isSp).slice(0,3);
  return sp.concat(r.filter(l=>!sp.includes(l)));
}
const chip=(k,t,on)=>`<button class="tab${on?' on':''}" onclick="tg('${k}')">${t}</button>`;
function tg(k){
  if(k=='vo')vo=!vo;
  else if(k=='sv'){if(!me)return authM();sv=!sv}
  else if(k=='nr'){
    if(near){near=null}else{navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{near=[p.coords.latitude,p.coords.longitude];render()},()=>alert('Allow location access to sort by distance.')):alert('Location not supported.');return}
  }
  render();
}
function render(){
  $('tabs').innerHTML=[['all','All'],['buy','Buy'],['rent','Rent'],['flip','Flip deals']].map(([k,v])=>`<button class="tab${mode==k?' on':''}" onclick="mode='${k}';render()">${v}</button>`).join('')
    +chip('vo','✔ Verified',vo)+chip('sv','♥ Saved',sv)+chip('nr','📍 Near me',!!near)
    +`<button class="tab${view=='map'?' on':''}" onclick="view=view=='map'?'list':'map';render()">🗺 Map</button><button class="tab" onclick="insM()">🔎 Inspectors</button>`;
  const r=list();
  $('grid').innerHTML=r.length?r.map(card).join(''):'<div class="empty">No listings yet. Agents and landlords can sign up and tap “+ List” to add the first one.</div>';
  drawMap(r);
}
function card(l){
  const m=(l.media||[]).find(x=>x.kind=='image'),sp=isSp(l);
  return `<div class="card${sp?' sp':''}" onclick="show(${l.id})"><div class="img"${m?` style="background-image:url('${mu(m.path)}')"`:''}>${m?'':'<span class="ph">🏠</span>'}${l.mode=='flip'?'<span class="tag">FLIP DEAL</span>':''}${l.profiles?.verified?'<span class="tag r">✔ Verified</span>':''}${sp?'<span class="tag b">SPONSORED</span>':''}<span class="fv" onclick="event.stopPropagation();fav(${l.id})">${FV.has(l.id)?'♥':'♡'}</span></div><div class="cb"><div class="pr">${N(l.price)}${l.mode=='rent'?' /yr':''}</div><div>${esc(l.title)}</div><div class="mu">${esc(l.city)}${l.area?' · '+esc(l.area):''} · ${esc(l.type)}${l.beds?' · '+l.beds+' bed':''}${l._d!=null?' · '+l._d.toFixed(1)+' km':''}</div></div>${cact(l)}</div>`;
}
function drawMap(r){
  const el=$('map');
  if(view!='map'){el.style.display='none';return}
  el.style.display='block';
  if(!map){
    map=MAPLIB.map('map').setView([9.08,8.67],6);
    MAPLIB.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    layer=MAPLIB.layerGroup().addTo(map);
  }
  layer.clearLayers();const pts=[];
  r.filter(l=>l.lat!=null).forEach(l=>{
    MAPLIB.circleMarker([l.lat,l.lng],{radius:10,color:'#fff',weight:2,fillColor:isSp(l)?'#B3833B':'#5C3D1B',fillOpacity:1}).addTo(layer).bindTooltip(N(l.price)).on('click',()=>show(l.id));
    pts.push([l.lat,l.lng]);
  });
  setTimeout(()=>{map.invalidateSize();if(near)pts.push(near);if(pts.length)map.fitBounds(pts,{padding:[30,30],maxZoom:14})},60);
}

async function doAuth(up){
  const email=$('ae').value.trim(),password=$('ap').value;let r;

  else{FV.add(id);render();await sb.from('favorites').insert({listing_id:id})}

function show(id){
  const l=L.find(x=>x.id==id);if(!l)return;
  const med=(l.media||[]).map(m=>m.kind=='video'?`<video src="${mu(m.path)}" controls playsinline></video>`:`<img src="${mu(m.path)}" alt="">`).join('');
  const flip=l.mode=='flip'&&l.arv?`<div class="note"><b>Flip estimate</b><br>Buy ${N(l.price)} + repairs ${N(l.repair||0)} → resell ${N(l.arv)}<br><b>Potential profit: ${N(l.arv-l.price-(l.repair||0))}</b> <span class="mu">(estimate only)</span></div>`:'';

}
async function del(id){
  if(!confirm('Delete this listing?'))return;
  const {error}=await sb.from('listings').delete().eq('id',id);if(error)return alert(error.message);
  L=L.filter(x=>x.id!=id);closeM();render();

function postM(){
  if(!me)return authM();
  if(!['agent','landlord'].includes(prof?.role)){alert('Only agents and landlords can list properties. Create an account with that role.');return}
  PG=null;setTimeout(initPin,80);
  openM(`<h2>List a property</h2><input id="pt" placeholder="Title e.g. 3-bed flat, Lekki"><div class="row"><select id="pm"><option value="buy">For sale</option><option value="rent">For rent (per year)</option><option value="flip">Flip deal</option></select><select id="py"><option>Flat</option><option>House</option><option>Duplex</option><option>Land</option></select></div><div class="row"><select id="pc" onchange="pcCity()">${stOpts()}</select><input id="pa" placeholder="Area / neighbourhood"></div><div class="row"><input id="pp" type="number" placeholder="Price ₦"><input id="pb" type="number" placeholder="Bedrooms"></div><div class="row"><input id="pv" type="number" placeholder="Resale value (flip)"><input id="pr" type="number" placeholder="Repair cost (flip)"></div><textarea id="pd" rows="3" placeholder="Describe the property"></textarea><label class="mu">Drag the pin to the exact spot (or tap the map)</label><div id="pmap"></div><button class="btn o w" onclick="geo()">📍 Use my current location</button><p id="pg" class="mu">If you skip this, the state capital is used.</p><label class="mu">Photos / video (up to 5)</label><input id="pf" type="file" accept="image/*,video/*" multiple><button class="btn w" id="ps" onclick="post()">Publish</button><p id="er" class="er"></p>`);
}
function geo(){
  navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{PG=[p.coords.latitude,p.coords.longitude];if(pmap){pmap.setView(PG,16);pmk.setLatLng(PG)}$('pg').textContent='📍 Location set. Drag the pin to adjust.'},()=>$('pg').textContent='Could not get your location. Drag the pin instead.'):0;
}
function initPin(){
  if(!$('pmap'))return;
  if(pmap){pmap.remove();pmap=null}
  const c=CC[$('pc').value];
  pmap=MAPLIB.map('pmap').setView(c,12);
  MAPLIB.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(pmap);
  pmk=MAPLIB.marker(c,{draggable:true,icon:MAPLIB.divIcon({html:'📍',className:'pin',iconSize:[30,30],iconAnchor:[15,28]})}).addTo(pmap);
  const set=ll=>{PG=[ll.lat,ll.lng];$('pg').textContent='📍 Pin set. Drag to adjust.'};
  pmk.on('dragend',()=>set(pmk.getLatLng()));
  pmap.on('click',e=>{pmk.setLatLng(e.latlng);set(e.latlng)});
  setTimeout(()=>pmap&&pmap.invalidateSize(),150);
}
function pcCity(){
  if(!pmap)return;
  const c=CC[$('pc').value];pmap.setView(c,12);pmk.setLatLng(c);PG=null;$('pg').textContent='If you skip this, the state capital is used.';
}
async function post(){
  err('');
  const b=$('ps');
  try{
    const title=$('pt').value.trim(),price=parseFloat(String($('pp').value).replace(/[^0-9.]/g,'')),city=$('pc').value;
    if(title.length<3)return err('Add a title (at least 3 characters)');
    if(!price||price<=0)return err('Add a price in numbers, e.g. 2000000');
    b.disabled=true;b.textContent='Publishing…';
    const files=[...$('pf').files].slice(0,5),media=[];
    for(let i=0;i<files.length;i++){
      const f=files[i],ext=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'bin',path=`${me.id}/${Date.now()}-${i}.${ext}`;
      b.textContent='Uploading '+(i+1)+' of '+files.length+'…';
      const {error}=await sb.storage.from('listing-media').upload(path,f,{contentType:f.type||'image/jpeg'});
      if(error)throw new Error('Photo upload failed: '+error.message);
      media.push({path,kind:(f.type||'').startsWith('video')?'video':'image'});
    }
    b.textContent='Saving…';
    const c=PG||CC[city];
    const row={owner_id:me.id,title,description:$('pd').value.trim().slice(0,1000),city,area:$('pa').value.trim()||null,type:$('py').value,mode:$('pm').value,price,beds:parseInt($('pb').value)||0,lat:c[0],lng:c[1],arv:parseFloat($('pv').value)||null,repair:parseFloat($('pr').value)||null,media};
    const {data,error}=await sb.from('listings').insert(row).select('*,profiles!owner_id(name,verified,role)').single();
    if(error)throw new Error('Could not save listing: '+error.message);
    L.unshift(data);closeM();render();
  }catch(e){
    err(String(e&&e.message||e));
    b.disabled=false;b.textContent='Publish';
  }
}

/* ---------- chat ---------- */
async function chat(id){
  if(!me)return authM();
  const l=L.find(x=>x.id==id);
  if(l.owner_id==me.id)return inbox(id);
  let {data:t}=await sb.from('threads').select('id').eq('listing_id',id).eq('buyer_id',me.id).maybeSingle();
  if(!t){const r=await sb.from('threads').insert({listing_id:id,owner_id:l.owner_id}).select('id').single();if(r.error)return alert(r.error.message);t=r.data}
  thread(t.id);
}
async function inbox(lid){
  if(!me)return authM();
  await loadChat();
  let T=TH.slice();if(lid)T=T.filter(t=>t.listing_id==lid);
  const last=t=>MG.find(m=>m.thread_id==t.id);
  T.sort((a,b)=>new Date(last(b)?.created_at||0)-new Date(last(a)?.created_at||0));
  openM(`<h2>Messages</h2>${window.Notification&&Notification.permission=='default'?'<button class="btn o w" onclick="askNotif()">🔔 Turn on message alerts</button>':''}`+(T.length?T.map(t=>{const o=t.buyer_id==me.id?t.owner_id:t.buyer_id,m=last(t),n=unrFor(t.id);return `<div class="note pt" onclick="thread(${t.id})"><b>${esc(t.listings?.title||'Inspector chat')}</b>${n?` <span class="bdg" style="position:static;display:inline-block">${n}</span>`:''}<br>${esc(NM[o]||'')}<br><span class="mu">${m?esc((m.sender_id==me.id?'You: ':'')+m.body.slice(0,60)):'No messages yet'}</span></div>`}).join(''):'<p class="mu">No conversations yet. Tap 💬 Chat on any listing to start one.</p>'));
}
async function thread(id){
  if(!TH.find(x=>x.id==id))await loadChat();
  if(ch){sb.removeChannel(ch);ch=null}
  SEEN=new Set();
  openM(`<h3 style="margin:0">${chatTitle(id)}</h3><div id="ms" class="ms"></div><div class="row"><input id="mi" placeholder="Type a message" style="margin:0" onkeydown="if(event.key=='Enter')send(${id})"><button class="btn" style="flex:0 0 auto" onclick="send(${id})">Send</button></div>`);
  const {data}=await sb.from('messages').select('*').eq('thread_id',id).order('created_at');
  curTh=id;(data||[]).forEach(addMsg);markRead(id);
  ch=sb.channel('t'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'thread_id=eq.'+id},p=>addMsg(p.new)).subscribe();
}
function addMsg(m){
  if(SEEN.has(m.id))return;SEEN.add(m.id);const e=$('ms');if(!e)return;
  e.insertAdjacentHTML('beforeend',`<div class="${m.sender_id==me.id?'me':'th'}"><span>${esc(m.body)}</span></div>`);e.scrollTop=e.scrollHeight;
}
async function send(id){
  const i=$('mi'),body=i.value.trim();if(!body)return;i.value='';
  const {data,error}=await sb.from('messages').insert({thread_id:id,body}).select().single();
  error?alert(error.message):addMsg(data);
}

  if(t=='v'){
    const {data,error}=await sb.from('verifications').select('*,profiles!user_id(name,role)').eq('status','pending').order('created_at');
    h=error?`<p class="er">${esc(error.message)}</p>`:(data||[]).map(v=>`<div class="note"><b>${esc(v.profiles?.name)}</b> · ${esc(v.profiles?.role)}<br>Ref: ${esc(v.reg_ref)}<br>Phone: ${esc(v.phone)}<br>${esc(v.note||'')}<div class="row" style="margin-top:8px"><button class="btn" onclick="rv('${v.user_id}',true)">Approve</button><button class="btn o" onclick="rv('${v.user_id}',false)">Reject</button></div></div>`).join('')||'<p class="mu">No pending verification requests.</p>';
  }else if(t=='p'){
    const {data,error}=await sb.from('promo_requests').select('*,listings!listing_id(title),profiles!user_id(name)').eq('status','pending').order('created_at');
    h=error?`<p class="er">${esc(error.message)}</p>`:(data||[]).map(p=>`<div class="note"><b>${esc(p.listings?.title)}</b><br>${esc(p.profiles?.name)} · ${p.days} days · ${p.days==30?'₦15,000':'₦5,000'}<div class="row" style="margin-top:8px"><button class="btn" onclick="pa(${p.id},true)">Paid: activate</button><button class="btn o" onclick="pa(${p.id},false)">Dismiss</button></div></div>`).join('')||'<p class="mu">No pending sponsorship requests.</p>';
  }else if(t=='c'){
    const {data,error}=await sb.from('complaints').select('*,reporter:profiles!user_id(name,role),about:profiles!about_user(name,role),listings!listing_id(title)').neq('status','resolved').order('created_at');
    h=error?`<p class="er">${esc(error.message)}</p>`:(data||[]).map(c=>`<div class="note"><b>#${c.id} · ${esc(c.subject)}</b> · ${esc(KINDS[c.kind]||c.kind)} · ${esc(c.status)}<br>From: ${esc(c.reporter?.name)} (${esc(c.reporter?.role)})${c.about?`<br>About: ${esc(c.about.name)} (${esc(c.about.role)})`:''}${c.listings?`<br>Listing: ${esc(c.listings.title)}`:''}<br>${esc(c.message)}${c.admin_note?`<br><b>Note:</b> ${esc(c.admin_note)}`:''}<div class="row" style="margin-top:8px"><button class="btn o" onclick="cm(${c.id},'in_review')">In review</button><button class="btn" onclick="cm(${c.id},'resolved')">Resolve</button></div></div>`).join('')||'<p class="mu">No open complaints 🎉</p>';
  }else{
    const {data,error}=await sb.from('inspection_requests').select('*,listings!listing_id(title),profiles!inspector_id(name)').order('created_at',{ascending:false}).limit(30);
    h=error?`<p class="er">${esc(error.message)}</p>`:(data||[]).map(r=>`<div class="note"><b>${esc(r.listings?.title||'Listing')}</b><br>${esc(r.name)} · ${esc(r.phone)}<br>${r.preferred_date?esc(r.preferred_date):'No date'} · Inspector: ${esc(r.profiles?.name||'any')}</div>`).join('')||'<p class="mu">No inspection requests yet.</p>';
  }
  openM(`<h2>Admin</h2>${tabs}${h}`);
}
async function rv(id,ok){const {error}=await sb.rpc('review_verification',{uid:id,approve:ok});if(error)return alert(error.message);await loadAll();adminM('v')}
async function pa(id,ok){const {error}=ok?await sb.rpc('activate_promo',{req:id}):await sb.from('promo_requests').update({status:'dismissed'}).eq('id',id);if(error)return alert(error.message);await loadAll();adminM('p')}
async function unsp(id){const {error}=await sb.from('promotions').delete().eq('listing_id',id);if(error)return alert(error.message);delete PM[id];closeM();render()}

/* ---------- unread, alerts, card chat ---------- */
function cact(l){
  if(me&&l.owner_id==me.id){const n=unrForListing(l.id);return `<div class="cact"><button class="btn o" onclick="event.stopPropagation();inbox(${l.id})">💬 Messages${n?` (${n} new)`:''}</button></div>`}
  return `<div class="cact"><button class="btn" onclick="event.stopPropagation();chat(${l.id})">💬 Chat</button><button class="btn o" onclick="event.stopPropagation();bookM(${l.id})">🔎 Inspect</button></div>`;
}
function chatTitle(id){
  const t=TH.find(x=>x.id==id);if(!t)return 'Chat';
  const o=t.buyer_id==me.id?t.owner_id:t.buyer_id;
  return esc(t.listings?.title||'Inspector chat')+' <span class="mu">· '+esc(NM[o]||'')+'</span><br><a class="mu" style="font-size:13px;cursor:pointer;text-decoration:underline" onclick="reportT('+id+')">⚠ Report this person</a>';
}
function unrFor(tid){const r=RD[tid]||0;return MG.filter(m=>m.thread_id==tid&&m.sender_id!=me.id&&new Date(m.created_at).getTime()>r).length}
function unrTotal(){return me?TH.reduce((a,t)=>a+unrFor(t.id),0):0}
function unrForListing(lid){return TH.filter(t=>t.listing_id==lid&&t.owner_id==me.id).reduce((a,t)=>a+unrFor(t.id),0)}
function updBadge(){
  const n=unrTotal(),b=$('msgn');
  b.textContent=n>9?'9+':(n||'');b.style.display=n?'inline-block':'none';
  document.title=(n?`(${n}) `:'')+'Nesta – Find your nest';
}
async function loadChat(){
  if(!me)return;
  const [t,r,m]=await Promise.all([
    sb.from('threads').select('id,listing_id,buyer_id,owner_id,listings(title)'),
    sb.from('thread_reads').select('*'),
    sb.from('messages').select('*').order('created_at',{ascending:false}).limit(300)]);
  TH=t.data||[];RD={};(r.data||[]).forEach(x=>RD[x.thread_id]=new Date(x.last_read_at).getTime());MG=m.data||[];
  const ids=[...new Set(TH.map(x=>x.buyer_id==me.id?x.owner_id:x.buyer_id))].filter(i=>!NM[i]);
  if(ids.length){const p=await sb.from('profiles').select('id,name').in('id',ids);(p.data||[]).forEach(x=>NM[x.id]=x.name)}
  updBadge();render();
}
async function markRead(tid){
  const last=Math.max(Date.now(),...MG.filter(m=>m.thread_id==tid).map(m=>new Date(m.created_at).getTime()));
  RD[tid]=last;updBadge();
  await sb.from('thread_reads').upsert({user_id:me.id,thread_id:tid,last_read_at:new Date(last).toISOString()},{onConflict:'user_id,thread_id'});
}
function startRT(){
  stopRT();
  gch=sb.channel('inbox-'+me.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},onMsg).subscribe();
}
function stopRT(){if(gch){sb.removeChannel(gch);gch=null}}
async function onMsg(p){
  const m=p.new;if(!m||!me||m.sender_id==me.id)return;
  if(!MG.find(x=>x.id==m.id))MG.unshift(m);
  if(!TH.find(t=>t.id==m.thread_id))await loadChat();
  if(curTh==m.thread_id&&$('ms')){markRead(m.thread_id);return}
  updBadge();render();
  const who=NM[m.sender_id]||'Someone';
  toast('💬 '+who+': '+m.body.slice(0,70),m.thread_id);
  if(window.Notification&&Notification.permission=='granted'&&document.hidden){try{new Notification('Nesta · '+who,{body:m.body.slice(0,100)})}catch(e){}}
}
function toast(t,tid){
  let e=$('toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';document.body.appendChild(e)}
  e.textContent=t;e.style.display='block';e.onclick=()=>{e.style.display='none';thread(tid)};
  clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',7000);
}
function askNotif(){Notification.requestPermission().then(()=>inbox())}

/* ---------- settings ---------- */
function themeSet(t){
  try{t?localStorage.setItem('nesta-theme',t):localStorage.removeItem('nesta-theme')}catch(e){}
  t?document.documentElement.setAttribute('data-theme',t):document.documentElement.removeAttribute('data-theme');
  settingsM();
}
function settingsM(){
  if(!me)return authM();
  const th=document.documentElement.getAttribute('data-theme')||'';
  openM(`<h2>Settings</h2><p class="mu">${esc(me.email||'')}</p>
  <label class="mu">Name</label><input id="sn" value="${esc(prof?.name||'')}">
  <label class="mu">I am a…</label><select id="sr">${Object.entries(ROLE).map(([k,v])=>`<option value="${k}"${prof?.role==k?' selected':''}>${v}</option>`).join('')}</select>
  <label class="mu" style="display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" id="se" style="width:auto;margin:0" ${prof?.email_alerts!==false?'checked':''}> Email me about new messages</label>
  <button class="btn w" onclick="saveSet()">Save changes</button><p id="er" class="er"></p>
  <h3>Appearance</h3><div class="row">${[['','Auto'],['light','☀️ Light'],['dark','🌙 Dark']].map(([k,v])=>`<button class="btn${th==k?'':' o'}" onclick="themeSet('${k}')">${v}</button>`).join('')}</div>
  <h3>Alerts</h3><button class="btn o w" onclick="alertsOn()">🔔 Browser alerts</button>
  <h3>Password</h3><input id="sp" type="password" placeholder="New password (6+ characters)" autocomplete="new-password"><button class="btn o w" onclick="newPw()">Change password</button><p id="er2" class="er"></p>
  <h3>Help</h3><button class="btn o w" onclick="careM()">🛟 Customer care</button><button class="btn o w" onclick="myComplaints()">My complaints</button>
  <button class="btn o w" style="margin-top:14px" onclick="out()">Sign out</button>`);
}
async function saveSet(){
  const name=$('sn').value.trim().slice(0,40),role=$('sr').value,email_alerts=$('se').checked;
  if(!name)return err('Add your name');
  if(prof.verified&&role!=prof.role&&!confirm('Changing your role removes your Verified badge. You will need to verify again. Continue?'))return;
  const {error}=await sb.from('profiles').update({name,role,email_alerts}).eq('id',me.id);
  if(error)return err(error.message);
  await setUser(me);await loadAll();settingsM();good('Saved ✔');
}
async function newPw(){
  const pw=$('sp').value,e=$('er2');
  if(pw.length<6){e.textContent='Use at least 6 characters';return}
  const {error}=await sb.auth.updateUser({password:pw});
  e.textContent=error?error.message:'Password changed ✔';e.style.color=error?'':'#2f855a';
}
function alertsOn(){
  if(!window.Notification)return alert('This browser cannot show alerts here. On iPhone, add Nesta to your Home Screen first.');
  Notification.requestPermission().then(p=>alert(p=='granted'?'Alerts are on while Nesta is open in the background.':'Alerts are blocked. Allow notifications for this site in your browser settings.'));
}

/* ---------- customer care ---------- */
const KINDS={page:'Problem with the website',agent:'Report an agent',landlord:'Report a landlord',inspector:'Report an inspector',buyer:'Report a buyer / renter',other:'Something else'};
let CC0={};
function careM(ctx){
  if(!me)return authM();
  CC0=ctx||{};
  openM(`<h2>Customer care</h2><p class="mu">Tell us what went wrong. We read every complaint.</p><select id="ck">${Object.entries(KINDS).map(([k,v])=>`<option value="${k}"${k==(CC0.kind||'page')?' selected':''}>${v}</option>`).join('')}</select>${CC0.about||CC0.lid?`<div class="note">About: ${CC0.title?esc(CC0.title)+' · ':''}${esc(CC0.aboutName||'')}</div>`:''}<input id="cs" placeholder="Short subject" maxlength="120"><textarea id="cm" rows="5" maxlength="1000" placeholder="What happened? Include dates and details."></textarea><button class="btn w" onclick="careSend()">Send complaint</button><p id="er" class="er"></p><button class="btn o w" onclick="myComplaints()">My complaints</button>`);
}
async function careSend(){
  const subject=$('cs').value.trim(),message=$('cm').value.trim();
  if(subject.length<3)return err('Add a short subject');
  if(message.length<5)return err('Please describe what happened');
  const row={kind:$('ck').value,subject,message};
  if(CC0.about)row.about_user=CC0.about;if(CC0.lid)row.listing_id=CC0.lid;
  const {data,error}=await sb.from('complaints').insert(row).select('id').single();
  if(error)return err(error.message);
  openM(`<h2>Complaint sent ✔</h2><p>Reference <b>#${data.id}</b>. We will review it and update its status. You can follow it under <b>My complaints</b>.</p><button class="btn w" onclick="myComplaints()">My complaints</button><button class="btn o w" onclick="closeM()">Done</button>`);
}
async function myComplaints(){
  const {data,error}=await sb.from('complaints').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(30);
  const st={open:'🟡 Open',in_review:'🔵 In review',resolved:'🟢 Resolved'};
  openM('<h2>My complaints</h2>'+(error?`<p class="er">${esc(error.message)}</p>`:(data||[]).length?data.map(c=>`<div class="note"><b>#${c.id} · ${esc(c.subject)}</b><br>${st[c.status]||esc(c.status)} · ${esc(KINDS[c.kind]||c.kind)}<br>${esc(c.message.slice(0,140))}${c.admin_note?`<br><b>Reply:</b> ${esc(c.admin_note)}`:''}</div>`).join(''):'<p class="mu">You have not filed any complaints.</p>')+'<button class="btn w" onclick="careM()">New complaint</button>');
}
function reportL(id){
  const l=L.find(x=>x.id==id);if(!l)return;
  const r=l.profiles?.role;
  careM({lid:id,about:l.owner_id,aboutName:l.profiles?.name,title:l.title,kind:['agent','landlord'].includes(r)?r:'other'});
}
function reportT(id){
  const t=TH.find(x=>x.id==id);if(!t)return;
  const o=t.buyer_id==me.id?t.owner_id:t.buyer_id;
  careM({about:o,aboutName:NM[o],kind:'other'});
}
async function cm(id,status){
  const note=prompt('Note for the user (optional)');if(note===null)return;
  const upd={status};if(note.trim())upd.admin_note=note.trim().slice(0,300);
  const {error}=await sb.from('complaints').update(upd).eq('id',id);
  if(error)return alert(error.message);
  adminM('c');
}

loadAll();
</script>
</body>
